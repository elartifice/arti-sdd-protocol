<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450" role="img" aria-labelledby="title desc">
<title id="title">Arti SDD: from idea to verified work</title><desc id="desc">A colourful top-to-bottom five-step loop: agree the outcome, create a scoped ticket, give agents focused work, verify with checks and the selected review policy, then merge and save shared lessons. Failed checks return to implementation. Completed work leads to the next ticket.</desc>
<defs><linearGradient id="bg" x2="0.9" y2="1"><stop stop-color="#10162e"/><stop offset="1" stop-color="#080c1d"/></linearGradient><radialGradient id="glow"><stop stop-color="#6d4aff" stop-opacity=".25"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#c2d1ee" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="1100" height="1450" rx="32" fill="url(#bg)"/><circle cx="1020" cy="120" r="440" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="70" y="48" width="267" height="42" rx="21" fill="#263451" stroke="none" stroke-width="2" /><text x="93" y="77" font-size="20" fill="#f3f6ff" font-weight="700" >ARTI SDD PROTOCOL</text><text x="70" y="151" font-size="53" fill="#f5f7ff" font-weight="800" >FROM IDEA TO</text><text x="70" y="215" font-size="65" fill="#77f7d0" font-weight="800" >VERIFIED WORK.</text><text x="73" y="258" font-size="27" fill="#b9c6e2" font-weight="400" >Clear scope. Focused agents. Evidence before done.</text><rect x="70" y="310" width="960" height="166" rx="24" fill="#151f38" stroke="#68dcff" stroke-width="2" /><rect x="91" y="333" width="88" height="88" rx="24" fill="#68dcff" stroke="none" stroke-width="2" /><text x="108" y="392" font-size="45" fill="#10162e" font-weight="800" >01</text><text x="203" y="358" font-size="32" fill="#f5f7ff" font-weight="800" >AGREE THE OUTCOME</text><text x="203" y="398" font-size="24" fill="#b9c6e2" font-weight="400" >What are we building? How will we check success?</text><text x="204" y="446" font-size="19" fill="#68dcff" font-weight="700" letter-spacing="2">CHARTER + SPEC</text><path d="M550 484 L550 504" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="511" width="960" height="166" rx="24" fill="#151f38" stroke="#b49aff" stroke-width="2" /><rect x="91" y="534" width="88" height="88" rx="24" fill="#b49aff" stroke="none" stroke-width="2" /><text x="108" y="593" font-size="45" fill="#10162e" font-weight="800" >02</text><text x="203" y="559" font-size="32" fill="#f5f7ff" font-weight="800" >CUT A REAL TICKET</text><text x="203" y="599" font-size="24" fill="#b9c6e2" font-weight="400" >One goal, clear file scope, observable definition of done.</text><text x="204" y="647" font-size="19" fill="#b49aff" font-weight="700" letter-spacing="2">BOUNDED WORK</text><path d="M550 685 L550 705" fill="none" stroke="#b49aff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="712" width="960" height="166" rx="24" fill="#151f38" stroke="#ffbb65" stroke-width="2" /><rect x="91" y="735" width="88" height="88" rx="24" fill="#ffbb65" stroke="none" stroke-width="2" /><text x="108" y="794" font-size="45" fill="#10162e" font-weight="800" >03</text><text x="203" y="760" font-size="32" fill="#f5f7ff" font-weight="800" >GIVE AGENTS FOCUS</text><text x="203" y="800" font-size="24" fill="#b9c6e2" font-weight="400" >Send the relevant context to the right role and model.</text><text x="204" y="848" font-size="19" fill="#ffbb65" font-weight="700" letter-spacing="2">FOCUSED DOSSIER</text><path d="M550 886 L550 906" fill="none" stroke="#ffbb65" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="913" width="960" height="166" rx="24" fill="#151f38" stroke="#ff82a6" stroke-width="2" /><rect x="91" y="936" width="88" height="88" rx="24" fill="#ff82a6" stroke="none" stroke-width="2" /><text x="108" y="995" font-size="45" fill="#10162e" font-weight="800" >04</text><text x="203" y="961" font-size="32" fill="#f5f7ff" font-weight="800" >DEMAND EVIDENCE</text><text x="203" y="1001" font-size="24" fill="#b9c6e2" font-weight="400" >Run checks and the cross-lab review policy you chose.</text><text x="204" y="1049" font-size="19" fill="#ff82a6" font-weight="700" letter-spacing="2">CHECKS + REVIEW</text><path d="M550 1087 L550 1107" fill="none" stroke="#ff82a6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="1114" width="960" height="166" rx="24" fill="#151f38" stroke="#77f7d0" stroke-width="2" /><rect x="91" y="1137" width="88" height="88" rx="24" fill="#77f7d0" stroke="none" stroke-width="2" /><text x="108" y="1196" font-size="45" fill="#10162e" font-weight="800" >05</text><text x="203" y="1162" font-size="32" fill="#f5f7ff" font-weight="800" >LAND &amp; REMEMBER</text><text x="203" y="1202" font-size="24" fill="#b9c6e2" font-weight="400" >Merge verified work. Share lessons for the next ticket.</text><text x="204" y="1250" font-size="19" fill="#77f7d0" font-weight="700" letter-spacing="2">SHARED KNOWLEDGE</text><rect x="70" y="1330" width="960" height="74" rx="20" fill="#202b44" stroke="none" stroke-width="2" /><text x="99" y="1361" font-size="24" fill="#f5f7ff" font-weight="700" >Checks fail? Revise the work and verify again.</text><text x="99" y="1390" font-size="22" fill="#b9c6e2" font-weight="400" >Checks pass? Land it, record the lesson, pick the next ticket.</text></g></svg>
