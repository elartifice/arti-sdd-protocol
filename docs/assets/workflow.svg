<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2200" viewBox="0 0 1200 2200" role="img" aria-labelledby="title desc"><title id="title">Arti SDD: the charter-to-ticket delivery loop</title><desc id="desc">Create a charter, divide it into tickets with a goal, dependencies, file territory, definition of done and evidence. Claim dependency-ready tickets whose territories do not overlap, and execute them in separate worktrees in parallel. Validate and review each ticket independently, repairing failures. Serialise landing, record evidence and shared lessons, then take the next unblocked ticket.</desc>
<defs><linearGradient id="bg" x2=".9" y2="1"><stop stop-color="#151d39"/><stop offset="1" stop-color="#080e20"/></linearGradient>
<marker id="a-cyan" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#67ddff" stroke-width="2" stroke-linejoin="round"/></marker>
<marker id="a-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#b59bff" stroke-width="2" stroke-linejoin="round"/></marker>
<marker id="a-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#ffc06a" stroke-width="2" stroke-linejoin="round"/></marker>
<marker id="a-pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linejoin="round"/></marker>
<marker id="a-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#6ce6bc" stroke-width="2" stroke-linejoin="round"/></marker>
<marker id="a-muted" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#bdcbe4" stroke-width="2" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="2200" rx="28" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="90" y="42" width="247" height="32" rx="16" fill="#0c152b" stroke="#67ddff" stroke-width="2"/>
<text x="104" y="65" font-size="17" fill="#67ddff" font-weight="700" >ARTI SDD PROTOCOL</text>
<text x="90" y="135" font-size="48" fill="#f7f9ff" font-weight="800" >ONE PROJECT. CLEAR TICKETS.</text>
<text x="90" y="194" font-size="29" fill="#bdcbe4" font-weight="400" >A repeatable path from charter to shipped work.</text>
<rect x="90" y="244" width="1020" height="180" rx="24" fill="#141e37" stroke="#67ddff" stroke-width="2"/>
<rect x="112" y="266" width="56" height="56" rx="16" fill="#67ddff"/>
<text x="126" y="305" font-size="27" fill="#0a1024" font-weight="800" >01</text>
<text x="190" y="293" font-size="31" fill="#f7f9ff" font-weight="800" >CREATE THE PROJECT CHARTER</text>
<text x="190" y="327" font-size="22" fill="#bdcbe4" font-weight="400" >Agree what success means before implementation.</text>
<rect x="118" y="364" width="240" height="32" rx="16" fill="#0c152b" stroke="#67ddff" stroke-width="2"/>
<text x="132" y="387" font-size="17" fill="#67ddff" font-weight="700" >Outcome + users</text>
<rect x="375" y="364" width="210" height="32" rx="16" fill="#0c152b" stroke="#67ddff" stroke-width="2"/>
<text x="389" y="387" font-size="17" fill="#67ddff" font-weight="700" >Scope + limits</text>
<rect x="602" y="364" width="220" height="32" rx="16" fill="#0c152b" stroke="#67ddff" stroke-width="2"/>
<text x="616" y="387" font-size="17" fill="#67ddff" font-weight="700" >Architecture</text>
<rect x="840" y="364" width="240" height="32" rx="16" fill="#0c152b" stroke="#67ddff" stroke-width="2"/>
<text x="854" y="387" font-size="17" fill="#67ddff" font-weight="700" >Milestones + checks</text>
<path d="M600 433V470" fill="none" stroke="#67ddff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/>
<rect x="90" y="486" width="1020" height="355" rx="24" fill="#141e37" stroke="#b59bff" stroke-width="2"/>
<rect x="112" y="508" width="56" height="56" rx="16" fill="#b59bff"/>
<text x="126" y="547" font-size="27" fill="#0a1024" font-weight="800" >02</text>
<text x="190" y="535" font-size="31" fill="#f7f9ff" font-weight="800" >SPLIT THE CHARTER INTO TICKETS</text>
<text x="190" y="569" font-size="22" fill="#bdcbe4" font-weight="400" >Each ticket is a small, testable delivery contract.</text>
<rect x="118" y="598" width="570" height="214" rx="16" fill="#0c152b" stroke="#354360" stroke-width="2"/>
<text x="140" y="632" font-size="25" fill="#f7f9ff" font-weight="700" >T006  •  Parse CSV imports</text>
<text x="140" y="669" font-size="15" fill="#b59bff" font-weight="700" >GOAL</text>
<text x="270" y="669" font-size="18" fill="#bdcbe4" font-weight="400" >Accept valid CSV; reject malformed rows.</text>
<text x="140" y="705" font-size="15" fill="#b59bff" font-weight="700" >DEPENDS ON</text>
<text x="270" y="705" font-size="18" fill="#bdcbe4" font-weight="400" >T002: schema contract</text>
<text x="140" y="741" font-size="15" fill="#b59bff" font-weight="700" >TERRITORY</text>
<text x="270" y="741" font-size="18" fill="#bdcbe4" font-weight="400" >src/import/** + tests/import/**</text>
<text x="140" y="777" font-size="15" fill="#b59bff" font-weight="700" >DONE WHEN</text>
<text x="270" y="777" font-size="18" fill="#bdcbe4" font-weight="400" >CLI cases pass + review evidence recorded.</text>
<text x="722" y="631" font-size="24" fill="#f7f9ff" font-weight="700" >Small enough to verify</text>
<text x="722" y="674" font-size="20" fill="#bdcbe4" font-weight="400" >Dependencies say what comes first.</text>
<text x="722" y="714" font-size="20" fill="#bdcbe4" font-weight="400" >Territory says which files may change.</text>
<text x="722" y="754" font-size="20" fill="#bdcbe4" font-weight="400" >DoD says what must be demonstrated.</text>
<text x="722" y="794" font-size="20" fill="#bdcbe4" font-weight="400" >Evidence says what actually passed.</text>
<path d="M600 850V883" fill="none" stroke="#67ddff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-cyan)"/>
<rect x="90" y="900" width="1020" height="270" rx="24" fill="#141e37" stroke="#ffc06a" stroke-width="2"/>
<rect x="112" y="922" width="56" height="56" rx="16" fill="#ffc06a"/>
<text x="126" y="961" font-size="27" fill="#0a1024" font-weight="800" >03</text>
<text x="190" y="949" font-size="31" fill="#f7f9ff" font-weight="800" >TAKE A READY TICKET</text>
<text x="190" y="983" font-size="22" fill="#bdcbe4" font-weight="400" >Dependencies done + territory free → claim ownership.</text>
<rect x="118" y="1010" width="455" height="124" rx="18" fill="#0c152b" stroke="#ffc06a" stroke-width="2"/>
<text x="140" y="1048" font-size="25" fill="#f7f9ff" font-weight="700" >T006  •  Import parser</text>
<text x="140" y="1081" font-size="20" fill="#bdcbe4" font-weight="400" >src/import/** + tests/import/**</text>
<rect x="140" y="1095" width="310" height="32" rx="16" fill="#0c152b" stroke="#ffc06a" stroke-width="2"/>
<text x="154" y="1118" font-size="17" fill="#ffc06a" font-weight="700" >Agent A · isolated worktree</text>
<rect x="627" y="1010" width="455" height="124" rx="18" fill="#0c152b" stroke="#ffc06a" stroke-width="2"/>
<text x="649" y="1048" font-size="25" fill="#f7f9ff" font-weight="700" >T007  •  Quickstart guide</text>
<text x="649" y="1081" font-size="20" fill="#bdcbe4" font-weight="400" >docs/quickstart.md</text>
<rect x="649" y="1095" width="310" height="32" rx="16" fill="#0c152b" stroke="#ffc06a" stroke-width="2"/>
<text x="663" y="1118" font-size="17" fill="#ffc06a" font-weight="700" >Agent B · isolated worktree</text>
<text x="600" y="1156" font-size="21" fill="#ffc06a" font-weight="700" text-anchor="middle" >Non-overlapping scope lets ready tickets run in parallel.</text>
<path d="M345 1179V1206" fill="none" stroke="#ffc06a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<path d="M855 1179V1206" fill="none" stroke="#ffc06a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/>
<rect x="90" y="1225" width="1020" height="425" rx="24" fill="#141e37" stroke="#ff91b2" stroke-width="2"/>
<rect x="112" y="1247" width="56" height="56" rx="16" fill="#ff91b2"/>
<text x="126" y="1286" font-size="27" fill="#0a1024" font-weight="800" >04</text>
<text x="190" y="1274" font-size="31" fill="#f7f9ff" font-weight="800" >EXECUTE, VALIDATE, REVIEW</text>
<text x="190" y="1308" font-size="22" fill="#bdcbe4" font-weight="400" >Each ticket progresses independently through its own checks.</text>
<rect x="118" y="1338" width="455" height="278" rx="18" fill="#0c152b" stroke="#354360" stroke-width="2"/>
<text x="140" y="1372" font-size="23" fill="#f7f9ff" font-weight="700" >T006  •  Focused role + model</text>
<rect x="140" y="1392" width="411" height="49" rx="12" fill="#141e37"/>
<text x="158" y="1424" font-size="21" fill="#ffc06a" font-weight="700" >Implement the approved slice</text>
<rect x="140" y="1461" width="411" height="49" rx="12" fill="#141e37"/>
<text x="158" y="1493" font-size="21" fill="#ff91b2" font-weight="700" >Run the ticket’s DoD checks</text>
<rect x="140" y="1530" width="411" height="49" rx="12" fill="#141e37"/>
<text x="158" y="1562" font-size="21" fill="#b59bff" font-weight="700" >Review under the chosen policy</text>
<path d="M344 1446V1455" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)"/>
<path d="M344 1515V1524" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)"/>
<path d="M140 1485H126V1416H136" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)" stroke-dasharray="8 8"/>
<text x="140" y="1602" font-size="18" fill="#ff91b2" font-weight="400" >Failed check? Repair this ticket, then rerun.</text>
<rect x="627" y="1338" width="455" height="278" rx="18" fill="#0c152b" stroke="#354360" stroke-width="2"/>
<text x="649" y="1372" font-size="23" fill="#f7f9ff" font-weight="700" >T007  •  Focused role + model</text>
<rect x="649" y="1392" width="411" height="49" rx="12" fill="#141e37"/>
<text x="667" y="1424" font-size="21" fill="#ffc06a" font-weight="700" >Implement the approved slice</text>
<rect x="649" y="1461" width="411" height="49" rx="12" fill="#141e37"/>
<text x="667" y="1493" font-size="21" fill="#ff91b2" font-weight="700" >Run the ticket’s DoD checks</text>
<rect x="649" y="1530" width="411" height="49" rx="12" fill="#141e37"/>
<text x="667" y="1562" font-size="21" fill="#b59bff" font-weight="700" >Review under the chosen policy</text>
<path d="M853 1446V1455" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)"/>
<path d="M853 1515V1524" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)"/>
<path d="M649 1485H635V1416H645" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-pink)" stroke-dasharray="8 8"/>
<text x="649" y="1602" font-size="18" fill="#ff91b2" font-weight="400" >Failed check? Repair this ticket, then rerun.</text>
<path d="M345 1661V1700" fill="none" stroke="#6ce6bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/>
<path d="M855 1661V1700" fill="none" stroke="#6ce6bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/>
<text x="600" y="1690" font-size="19" fill="#6ce6bc" font-weight="700" text-anchor="middle" >Each ticket lands when ready.</text>
<rect x="90" y="1720" width="1020" height="280" rx="24" fill="#141e37" stroke="#6ce6bc" stroke-width="2"/>
<rect x="112" y="1742" width="56" height="56" rx="16" fill="#6ce6bc"/>
<text x="126" y="1781" font-size="27" fill="#0a1024" font-weight="800" >05</text>
<text x="190" y="1769" font-size="31" fill="#f7f9ff" font-weight="800" >LAND ONE TICKET AT A TIME</text>
<text x="190" y="1803" font-size="22" fill="#bdcbe4" font-weight="400" >A serial landing lock protects the shared integration branch.</text>
<rect x="118" y="1830" width="962" height="58" rx="13" fill="#0c152b"/>
<text x="140" y="1867" font-size="24" fill="#f7f9ff" font-weight="700" >Check exact candidate  →  merge per policy  →  confirm the merge</text>
<text x="118" y="1930" font-size="24" fill="#bdcbe4" font-weight="400" >Save evidence + shared lessons. Close the ticket. Release its claim.</text>
<text x="118" y="1970" font-size="21" fill="#6ce6bc" font-weight="400" >Execution can continue in parallel while ready tickets queue for landing.</text>
<path d="M90 1900H38V1040H78" fill="none" stroke="#6ce6bc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)" stroke-dasharray="8 8"/>
<text x="25" y="1610" font-size="18" fill="#6ce6bc" font-weight="700" transform="rotate(-90 25 1610)" >NEXT UNBLOCKED TICKET</text>
<rect x="90" y="2050" width="1020" height="100" rx="20" fill="#141e37"/>
<text x="118" y="2088" font-size="24" fill="#f7f9ff" font-weight="700" >The board shows state. Ticket files, claims and evidence govern it.</text>
<text x="118" y="2127" font-size="22" fill="#bdcbe4" font-weight="400" >No ready work? Resolve blockers or approve the next scope change.</text>
</g></svg>
