<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">Arti custom agents: coordinator-led reporting hierarchy</title>
  <desc id="desc">One coordinator sits above four sibling subagents: scout, implementer, reviewer and conditional escalation. Cyan arrows send bounded tasks down from the coordinator; purple arrows return short results, checks and risks up to it. Subagents do not report to one another. Each has a role icon. The reviewer includes Claude and ChatGPT/OpenAI marks identifying the two review providers; OpenAI reviews run through Codex. All roles use shared rules and memory. The dated model and effort profile is shown; Claude effort is requested, Codex effort resolved.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111a33"/>
      <stop offset="1" stop-color="#080d1d"/>
    </linearGradient>
    <marker id="task" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#68dcff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="report" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#bb9cff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="1250" rx="36" fill="url(#background)"/>
