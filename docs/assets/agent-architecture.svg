<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1780" viewBox="0 0 1100 1780" role="img" aria-labelledby="title desc">
<title id="title">Arti custom agents: focused contexts, explicit models</title><desc id="desc">Top-to-bottom architecture. A coordinator sends a bounded dossier to only the roles needed. Scouts, implementers and reviewers work in separate contexts and return short evidence reports. An escalation role is used after repeated failure. Shared rules and memory are read by every role. The dated tested Claude and Codex model bindings are shown. Separate contexts do not guarantee fewer total tokens.</desc>
<defs><linearGradient id="bg" x2="0.9" y2="1"><stop stop-color="#10162e"/><stop offset="1" stop-color="#080c1d"/></linearGradient><radialGradient id="glow"><stop stop-color="#6d4aff" stop-opacity=".25"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></radialGradient><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#c2d1ee" stroke-width="2" stroke-linejoin="round"/></marker></defs>
<rect width="1100" height="1780" rx="32" fill="url(#bg)"/><circle cx="1020" cy="120" r="440" fill="url(#glow)"/>
<g font-family="Arial, Helvetica, sans-serif"><rect x="70" y="45" width="294" height="42" rx="21" fill="#263451" stroke="none" stroke-width="2" /><text x="92" y="74" font-size="19" fill="#f3f6ff" font-weight="700" >THE CUSTOM AGENT TEAM</text><text x="70" y="148" font-size="65" fill="#f5f7ff" font-weight="800" >BIG PLAN.</text><text x="70" y="215" font-size="65" fill="#68dcff" font-weight="800" >FOCUSED CONTEXTS.</text><text x="73" y="257" font-size="25" fill="#b9c6e2" font-weight="400" >Choose the roles the task needs. Keep their logs out of the main chat.</text><rect x="70" y="298" width="960" height="168" rx="24" fill="#1c2547" stroke="#b49aff" stroke-width="2" /><text x="99" y="341" font-size="29" fill="#b49aff" font-weight="800" >COORDINATOR</text><text x="99" y="380" font-size="29" fill="#f5f7ff" font-weight="700" >Own the ticket, scope, decisions and next step.</text><text x="99" y="424" font-size="23" fill="#b9c6e2" font-weight="400" >Claude: Opus 5.5 · high     /     Codex: GPT-6.1 Sol · high</text><path d="M550 477 L550 529" fill="none" stroke="#b49aff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="550" y="567" font-size="22" fill="#d8e3fa" font-weight="700" text-anchor="middle">ONE BOUNDED DOSSIER → ONLY THE ROLES NEEDED</text><rect x="70" y="598" width="960" height="682" rx="28" fill="#10192d" stroke="#334562" stroke-width="2" /><text x="100" y="639" font-size="20" fill="#b9c6e2" font-weight="700" letter-spacing="2">SEPARATE WORKER CONTEXTS</text><rect x="100" y="666" width="900" height="154" rx="22" fill="#19243d" stroke="#68dcff" stroke-width="2" /><rect x="122" y="690" width="9" height="102" rx="4" fill="#68dcff" stroke="none" stroke-width="2" /><text x="150" y="705" font-size="27" fill="#68dcff" font-weight="800" >SCOUT</text><text x="150" y="746" font-size="27" fill="#f5f7ff" font-weight="700" >Find facts, file locations and constraints.</text><text x="150" y="789" font-size="22" fill="#b9c6e2" font-weight="400" >Claude: Haiku 5.5 · low     /     Codex: GPT-6 Luna · high</text><rect x="100" y="842" width="900" height="154" rx="22" fill="#19243d" stroke="#77f7d0" stroke-width="2" /><rect x="122" y="866" width="9" height="102" rx="4" fill="#77f7d0" stroke="none" stroke-width="2" /><text x="150" y="881" font-size="27" fill="#77f7d0" font-weight="800" >IMPLEMENTER</text><text x="150" y="922" font-size="27" fill="#f5f7ff" font-weight="700" >Change scoped files. Run meaningful checks.</text><text x="150" y="965" font-size="22" fill="#b9c6e2" font-weight="400" >Claude: Sonnet 5.5 · high     /     Codex: GPT-6.1 Terra · high</text><rect x="100" y="1018" width="900" height="154" rx="22" fill="#19243d" stroke="#ff82a6" stroke-width="2" /><rect x="122" y="1042" width="9" height="102" rx="4" fill="#ff82a6" stroke="none" stroke-width="2" /><text x="150" y="1057" font-size="27" fill="#ff82a6" font-weight="800" >REVIEWER</text><text x="150" y="1098" font-size="27" fill="#f5f7ff" font-weight="700" >Challenge the change. Return concrete findings.</text><text x="150" y="1141" font-size="22" fill="#b9c6e2" font-weight="400" >Claude: Opus 5.5 · high     /     Codex: GPT-6.1 Sol · high</text><text x="100" y="1228" font-size="23" fill="#d8e3fa" font-weight="400" >Same-lab or cross-lab review, according to project policy.</text><text x="100" y="1260" font-size="22" fill="#b9c6e2" font-weight="400" >These are role choices, not a mandatory chain of three agents.</text><rect x="70" y="1310" width="960" height="126" rx="24" fill="#332d23" stroke="#ffbb65" stroke-width="2" stroke-dasharray="8 8"/><text x="98" y="1349" font-size="25" fill="#ffcc82" font-weight="800" >ESCALATION · ONLY AFTER REPEATED FAILURE</text><text x="98" y="1385" font-size="25" fill="#f5f7ff" font-weight="700" >A failure dossier prevents repeating rejected approaches.</text><text x="98" y="1416" font-size="22" fill="#b9c6e2" font-weight="400" >Claude: Opus 5.5 · high     /     Codex: GPT-6 Astra · high</text><path d="M550 1450 L550 1490" fill="none" stroke="#68dcff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="550" y="1528" font-size="22" fill="#d8e3fa" font-weight="700" text-anchor="middle">SHORT RESULT + CHECKS + EVIDENCE + OPEN RISKS</text><rect x="70" y="1554" width="960" height="118" rx="24" fill="#15352f" stroke="#77f7d0" stroke-width="2" /><text x="98" y="1596" font-size="25" fill="#77f7d0" font-weight="800" >COORDINATOR CONTINUES · SHARED MEMORY PERSISTS</text><text x="98" y="1634" font-size="24" fill="#f5f7ff" font-weight="400" >Every role reads relevant rules and lessons from the same files.</text><text x="70" y="1717" font-size="21" fill="#b9c6e2" font-weight="400" >Tested profile: 2026-11-03. Primary chat model remains your choice.</text><text x="70" y="1749" font-size="21" fill="#b9c6e2" font-weight="400" >Effort: Claude requested; Codex resolved. See agent setup for permission limits.</text></g></svg>
