<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc"><title id="title">An illustrative Arti SDD ticket board</title><desc id="desc">A read-only example board for an inventory CLI, with blocked, ready, working, review and done columns. Ready cards show dependencies and file territory; working cards show two agents in non-overlapping worktrees. A selected ticket detail panel displays its goal, definition of done, evidence and next action. This is example data for an optional graphical extension, not a shipped board application.</desc>
