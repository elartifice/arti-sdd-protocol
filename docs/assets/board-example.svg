<marker id="a-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#ffc06a" stroke-width="2" stroke-linejoin="round"/></marker>
<marker id="a-pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#ff91b2" stroke-width="2" stroke-linejoin="round"/></marker>
